# The gates that need nothing installed. Every one of these is documented in CLAUDE.md as a
# command run by hand; this file is the same commands, run on push, and it is not a substitute
# for the ones it cannot run.
#
# What this does NOT run, so a green tick here is never read as a full pass:
#   - the floor harness against fixtures/, which needs Playwright and a Chromium download. Its
#     package.json is deliberately gitignored (CLAUDE.md, "Commands"), so CI has nothing to
#     install from and adding one would ship a build shape to every installer.
#   - harness/round.tamper.json, whose fixtures run through Claude Code's Workflow tool.
#   - the driven fresh-context runs through each wrapper, which are agents and not a command.
name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: prose gate over every skill
        run: node tools/doc-check.mjs

      - name: doc-check tamper test
        # Exit 2 means the sidecar did not load and no clause ran, which is the quiet
        # direction: the gate above still exits 0 while its own tamper test stops existing.
        run: node tools/doc-check.mjs --selftest

      - name: herdr seat hook tamper test
        # Every decision in hooks/dctr-lib.mjs is pure, so this needs no herdr server, no codex
        # plugin and no Claude Code. What it cannot cover is the live path: the first real run
        # found a defect nineteen passing clauses did not, and clause 1m exists because of it.
        run: node hooks/dctr-seat.selftest.mjs

      - name: contained-posture containment tamper test
        # The behavioral guarantee the pure test cannot reach: a contained agent
        # (DCTR_VIEW_REQUEST_DIR set) drives the hook to write a request and call herdr zero times.
        # Proves the negative with a tripwire herdr on PATH. Needs only node.
        run: node hooks/dctr-seat.contained.selftest.mjs

      - name: gate launcher tamper test
        # Runs the launcher's detached path with a tripwire herdr on PATH: the check runs, its
        # output file ends with exit=N, and herdr is called zero times. Needs only node and bash.
        run: node hooks/dctr-gate.selftest.mjs

      - name: plugin hook manifest parses
        run: python3 -m json.tool hooks/hooks.json > /dev/null

      - name: manifests parse
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

      - name: workflow script syntax gate
        # Not `node --check`: the Workflow tool wraps the body in an async function, so the
        # script's top-level `return` is legal there and nowhere else. Same wrap as workflow.md.
        working-directory: skills/doctrine-gauntlet/harness
        run: |
          node -e 'const s=require("fs").readFileSync("round.workflow.mjs","utf8").replace(/^export const meta/m,"const meta");new Function("args","agent","parallel","pipeline","phase","log","budget","workflow","return (async()=>{"+s+"})()")'
